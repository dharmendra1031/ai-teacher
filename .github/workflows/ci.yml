name: CI

on:
  pull_request:
  push:
    branches: [development, main]

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage

  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [backend, realtime_agent]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.lock
      - run: python -m pip install ruff==0.12.7 mypy==1.17.1
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: ruff check .
      - run: mypy backend tests
        if: matrix.service == 'backend'
      - run: mypy agent tests
        if: matrix.service == 'realtime_agent'
      - run: python -m unittest discover -s tests -v

  postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_DB: ai_teacher_test
          POSTGRES_USER: ai_teacher_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_teacher_test -d ai_teacher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Verify PostgreSQL service
        run: python -c "import socket; socket.create_connection(('127.0.0.1', 5432), 5).close()"
      - name: Django missing migration check placeholder
        run: echo "Phase 3 replaces this with python manage.py makemigrations --check --dry-run"

  auth-compatibility-matrix:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - django: '5.2'
            drf: pending-phase-3
            jwt: pending-phase-3
    steps:
      - uses: actions/checkout@v4
      - name: Preserve mandatory auth gate
        run: echo "Django ${{ matrix.django }}, DRF ${{ matrix.drf }}, JWT ${{ matrix.jwt }}"

  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose --env-file .env.example -f infrastructure/compose.yaml config --quiet
      - name: Build CPU-only service images
        run: |
          docker build -t ai-teacher-backend:ci backend
          docker build -t ai-teacher-realtime-agent:ci realtime_agent

  security-and-supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: spikes
      - name: Generate repository SBOM
        uses: anchore/sbom-action@v0.20.6
        with:
          path: .
          format: spdx-json
          output-file: ai-teacher.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: ai-teacher-sbom
          path: ai-teacher.spdx.json
      - name: Python license report
        run: |
          python -m pip install pip-licenses==5.0.0
          python -m piplicenses --format=json --output-file=python-licenses.json
      - uses: actions/upload-artifact@v4
        with:
          name: python-license-report
          path: python-licenses.json
